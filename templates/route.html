{% extends "base.html" %}{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">{% endblock %}
{% block body %}<h1>🗺️ Safe Route</h1>
<div class="row"><div><label>From (blank = my location)</label><input id="from" placeholder="e.g. Pune Station"></div>
<div><label>To</label><input id="to" placeholder="e.g. Shivajinagar"></div>
<div style="flex:0 0 auto;align-self:end"><button class="btn" id="find">Find route</button></div></div>
<p id="info" class="mut"></p><div id="map"></div>
<div class="notice" id="tips">Safety prompts: prefer well-lit, busy roads; share your route with a guardian; avoid isolated shortcuts at night.</div>
<p><button class="btn ghost" id="share">Share route with guardian</button></p>{% endblock %}
{% block scripts %}<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script><script>
const map=L.map('map').setView([18.52,73.86],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
let layer=L.layerGroup().addTo(map),link='';
async function geo(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const j=await r.json();if(!j.length)throw 'Place not found: '+q;return{lat:+j[0].lat,lng:+j[0].lon}}
SH.pos().then(p=>{map.setView([p.lat,p.lng],14);L.circleMarker([p.lat,p.lng],{radius:8}).addTo(map).bindPopup('You are here')}).catch(()=>{});
document.getElementById('find').onclick=async()=>{const info=document.getElementById('info');info.textContent='Searching…';
 try{const f=document.getElementById('from').value.trim(),t=document.getElementById('to').value.trim();if(!t)throw 'Enter a destination';
  const a=f?await geo(f):await SH.pos();const b=await geo(t);
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`);
  const j=await r.json();if(!j.routes||!j.routes.length)throw 'No route found';
  layer.clearLayers();const rt=j.routes[0];const g=L.geoJSON(rt.geometry,{style:{color:'#c2185b',weight:5}}).addTo(layer);
  L.marker([a.lat,a.lng]).addTo(layer);L.marker([b.lat,b.lng]).addTo(layer);map.fitBounds(g.getBounds());
  const km=(rt.distance/1000).toFixed(1),min=Math.round(rt.duration/60);
  const h=new Date().getHours();const night=h>=20||h<6;
  info.textContent=`${km} km · about ${min} min by car`+(night?' · ⚠️ It is night time — stay on main roads and tell a guardian.':'');
  link=`https://www.google.com/maps/dir/${a.lat},${a.lng}/${b.lat},${b.lng}`}
 catch(e){info.textContent=typeof e==='string'?e:'Could not get location/route. Check permissions and internet.'}};
document.getElementById('share').onclick=()=>{if(!link)return alert('Find a route first.');
 const t='My route: '+link;if(navigator.share)navigator.share({text:t});else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener')};
</script>{% endblock %}
