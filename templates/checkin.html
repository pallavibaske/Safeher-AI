{% extends "base.html" %}{% block body %}
<h1>✅ Safety Check-in</h1><div class="card center"><h3>Are you safe right now?</h3>
<div class="row" style="margin:14px 0"><button class="btn ok" onclick="ans('safe')">I'm safe</button><button class="btn" onclick="ans('help')">I need help</button></div>
<p id="r" class="mut"></p></div>
<h3>Recent check-ins</h3><table><tr><th>Time</th><th>Status</th></tr>
{% for r in rows %}<tr><td>{{ r['created_at'] }}</td><td>{{ '✅ Safe' if r['status']=='safe' else '🚨 Help' }}</td></tr>{% else %}<tr><td colspan="2" class="mut">None yet.</td></tr>{% endfor %}</table>{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='app.js') }}"></script><script>
async function ans(s){await SH.post('/api/checkin',{status:s});const r=document.getElementById('r');
 if(s==='help'){r.textContent='Sending help alert…';const x=await SH.alert('checkin_help','Check-in: user asked for help');r.textContent='Help alert recorded. '+(x.notified?`Emailed ${x.notified} contact(s).`:'Open SOS page to share via WhatsApp, or call 112.')}
 else{r.textContent='Glad you are safe. Check-in saved.';setTimeout(()=>location.reload(),900)}}
</script>{% endblock %}
