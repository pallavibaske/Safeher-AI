<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SafeHer AI{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}</head><body class="{% block bodyclass %}{% endblock %}">
{% if user %}<nav><b>🛡️ SafeHer AI</b>
<a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('sos_page') }}">SOS</a>
<a href="{{ url_for('assistant') }}">AI Assistant</a><a href="{{ url_for('safe_route') }}">Safe Route</a>
<a href="{{ url_for('checkin_page') }}">Check-in</a><a href="{{ url_for('history') }}">History</a>
<a href="{{ url_for('profile') }}">Profile</a><a href="{{ url_for('logout') }}">Logout</a></nav>{% endif %}
<main>{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
