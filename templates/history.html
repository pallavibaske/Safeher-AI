{% extends "base.html" %}{% block body %}<h1>📜 Safety History</h1>
<table><tr><th>Time</th><th>Type</th><th>Location</th><th>Contacts emailed</th></tr>
{% for r in rows %}<tr><td>{{ r['created_at'] }}</td><td><span class="badge">{{ r['kind'] }}</span></td>
<td>{% if r['lat'] is not none %}<a target="_blank" rel="noopener" href="https://www.google.com/maps?q={{ r['lat'] }},{{ r['lng'] }}">Map</a>{% else %}—{% endif %}</td><td>{{ r['notified'] }}</td></tr>
{% else %}<tr><td colspan="4" class="mut">No alerts yet.</td></tr>{% endfor %}</table>{% endblock %}
